<!-- Modal -->
<div class="modal fade" id="issueCredentialModal" tabindex="-1" role="dialog" aria-labelledby="issueCredentialModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-gradient-primary text-white">
                <h5 class="modal-title text-white" id="issueCredentialModalLabel"> Create Student </h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="issueForm" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="name">Student Name:</label>
                        <input type="text" id="student_name" name="student_name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Student Last Name:</label>
                        <input type="text" id="student_last_name" name="student_last_name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="studentId">Student ID:</label>
                        <input type="text" id="student_id" name="student_id" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="program">Program:</label>
                        <input type="text" id="program" name="program" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="horaryZone">Horary Zone:</label>
                        <input type="text" id="horary_zone" name="horary_zone" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="graduationDate">Graduation Date:</label>
                        <input type="date" id="graduation_date" name="graduation_date" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fa-regular fa-floppy-disk"></i>
                        Create Student</button>
                </form>
                <div id="progress" class="alert alert-info mt-3 d-none" role="alert">
                    Transaction in progress... Please wait.
                </div>
            </div>
        </div>
    </div>
</div>
